name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: murmur-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen create-dmg

      - name: Set release versions
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os, re
          match = re.fullmatch(r'v?(\d+\.\d+\.\d+)(?:[-+][A-Za-z0-9.-]+)?', os.environ['RELEASE_TAG'])
          if not match:
              raise SystemExit('Release tags must be versions such as v2.0.1')
          build = 1000 + int(os.environ['GITHUB_RUN_NUMBER'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={match.group(1)}\nbuild={build}.{os.environ["GITHUB_RUN_ATTEMPT"]}\n')
          PY

      - name: Create placeholder Secrets.plist
        run: |
          cat > MurmurMobile/iOS/Secrets.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>GROQ_API_KEY</key>
            <string></string>
          </dict>
          </plist>
          PLIST

      # ── macOS ──────────────────────────────────────────────

      - name: Generate macOS project
        run: xcodegen generate

      - name: Test voice contract
        run: swift test --package-path MurmurKit

      - name: Test native voice lifecycle and gestures
        run: |
          xcodebuild test \
            -scheme Murmur \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM=""

      - name: Archive macOS app
        run: |
          xcodebuild archive \
            -scheme Murmur \
            -destination 'generic/platform=macOS' \
            -archivePath build/Murmur.xcarchive \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM=""

      - name: Package drag-to-Applications installer
        run: |
          scripts/package-mac.sh build/Murmur.xcarchive/Products/Applications/Murmur.app build/Murmur-Mac.dmg

      - name: Fetch pinned Sparkle signing tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/sparkle
          gh release download 2.10.1 --repo sparkle-project/Sparkle --pattern Sparkle-2.10.1.tar.xz --dir build/sparkle
          echo '1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27  build/sparkle/Sparkle-2.10.1.tar.xz' | shasum -a 256 -c -
          tar -xf build/sparkle/Sparkle-2.10.1.tar.xz -C build/sparkle

      - name: Sign and verify update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo 'Missing update-signing key'; exit 1; }
          python3 scripts/make-appcast.py \
            --app build/Murmur.xcarchive/Products/Applications/Murmur.app \
            --dmg build/Murmur-Mac.dmg \
            --tag "$RELEASE_TAG" \
            --sign-tool build/sparkle/bin/sign_update \
            --output build/appcast.xml

      # ── iOS ────────────────────────────────────────────────

      # The mobile clients still use the legacy upload path. Keep its credential
      # injection after Mac packaging: native Mac releases contain no API keys.
      - name: Inject legacy mobile API key
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          source = pathlib.Path("MurmurKit/Sources/MurmurKit/TranscriptionService.swift")
          code = source.read_text()
          key = json.dumps(os.environ.get("GROQ_API_KEY", ""))
          source.write_text(code.replace('private static let embeddedKey = ""', 'private static let embeddedKey = ' + key))
          PY

      - name: Generate iOS project
        run: cd MurmurMobile && xcodegen generate

      - name: Archive iOS app
        run: |
          cd MurmurMobile
          xcodebuild archive \
            -scheme Murmur \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ../build/MurmurMobile.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: Package iOS IPA
        run: |
          mkdir -p build/Payload
          cp -R build/MurmurMobile.xcarchive/Products/Applications/Murmur.app build/Payload/Murmur.app
          rm -rf build/Payload/Murmur.app/Watch
          cd build && zip -r Murmur.ipa Payload

      # ── Upload ─────────────────────────────────────────────

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Murmur-Mac.dmg
            build/appcast.xml
            build/Murmur.ipa
