name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create placeholder Secrets.plist
        run: |
          cat > MurmurMobile/iOS/Secrets.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>GROQ_API_KEY</key>
            <string></string>
          </dict>
          </plist>
          PLIST

      # ── macOS ──────────────────────────────────────────────

      - name: Generate macOS project
        run: xcodegen generate

      - name: Test voice contract
        run: swift test --package-path MurmurKit

      - name: Test native voice lifecycle and gestures
        run: |
          xcodebuild test \
            -scheme Murmur \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM=""

      - name: Archive macOS app
        run: |
          xcodebuild archive \
            -scheme Murmur \
            -destination 'generic/platform=macOS' \
            -archivePath build/Murmur.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM=""

      - name: Package macOS zip
        run: |
          cp -R build/Murmur.xcarchive/Products/Applications/Murmur.app build/Murmur.app
          cd build && zip -r Murmur-Mac.zip Murmur.app

      # ── iOS ────────────────────────────────────────────────

      # The mobile clients still use the legacy upload path. Keep its credential
      # injection after Mac packaging: native Mac releases contain no API keys.
      - name: Inject legacy mobile API key
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          source = pathlib.Path("MurmurKit/Sources/MurmurKit/TranscriptionService.swift")
          code = source.read_text()
          key = json.dumps(os.environ.get("GROQ_API_KEY", ""))
          source.write_text(code.replace('private static let embeddedKey = ""', 'private static let embeddedKey = ' + key))
          PY

      - name: Generate iOS project
        run: cd MurmurMobile && xcodegen generate

      - name: Archive iOS app
        run: |
          cd MurmurMobile
          xcodebuild archive \
            -scheme Murmur \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ../build/MurmurMobile.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: Package iOS IPA
        run: |
          mkdir -p build/Payload
          cp -R build/MurmurMobile.xcarchive/Products/Applications/Murmur.app build/Payload/Murmur.app
          rm -rf build/Payload/Murmur.app/Watch
          cd build && zip -r Murmur.ipa Payload

      # ── Upload ─────────────────────────────────────────────

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Murmur-Mac.zip
            build/Murmur.ipa
