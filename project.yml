name: Murmur
options:
  bundleIdPrefix: com.murmur
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

packages:
  MurmurKit:
    path: MurmurKit

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "ZHCT595PYJ"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Murmur:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Murmur
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: MurmurKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.murmur.app
        INFOPLIST_FILE: Murmur/Info.plist
        CODE_SIGN_ENTITLEMENTS: Murmur/Murmur.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    info:
      path: Murmur/Info.plist
      properties:
        LSUIElement: true
        NSMicrophoneUsageDescription: "Murmur needs microphone access to transcribe your voice."
        LSApplicationCategoryType: "public.app-category.productivity"
        NSBonjourServices:
          - _murmur._tcp
    entitlements:
      path: Murmur/Murmur.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.automation.apple-events: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true

schemes:
  Murmur:
    build:
      targets:
        Murmur: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
